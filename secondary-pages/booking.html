<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Winnington Park Bowmen</title>
        <link rel="stylesheet" href="../assets/styles.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
    </head>
    <body>

        <header>
            <img id="wpb-logo" src="../assets/images/WPB LOGO 300px 2026.png"
                alt="Winnington Park Bowmen Logo">
            <h1>Winnington Park Bowmen</h1>
            <nav id="navbar" class="navbar navbar-expand">
                <a class="nav-link" href="../index.html">Home</a>
                <a class="nav-link" href="../join.html">Join</a>
                <a class="nav-link" href="../juniorlings.html">Juniorlings</a>
                <a class="nav-link" href="../login.html">Login</a>
                <a class="nav-link" href="../members-area.html">Members Area</a>
            </nav>
        </header>

        <!--booking form page, Bootstrap form-->
        <div id="booking-form" class="active">
            <h2>Booking Form</h2>
            <form id="details">
                <div class="row">
                    <div class="mb-3 col-md-3">
                        <label for="sign-up-email" class="form-label">Email
                            Address</label>
                        <input type="email" class="form-control"
                            id="sign-up-email" aria-describedby="emailHelp">
                        <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                    </div>
                    <div class="mb-3 col-md-3">
                        <label for="fname" class="form-label">First Name</label>
                        <input type="fname" class="form-control" id="fname">
                    </div>
                    <div class="mb-3 col-md-3">
                        <label class="form-label" for="lname">Last Name</label>
                        <input type="text" class="form-control" id="lname">
                    </div>
                    <div class="mb-3 col-md-3">
                        <label class="form-label" for="phone">Phone
                            Number</label>
                        <input type="text" class="form-control" id="phone">
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-12">
                        <label class="form-label" for="address">Address</label>
                        <input type="text" class="form-control" id="address">
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-2">
                        <label class="form-label" for="dob">Date of
                            Birth</label>
                        <input type="date" class="form-control" id="dob">
                    </div>
                    <div class="mb-3 col-md-2">
                        <label class="form-label" for="gender">Gender</label>
                        <input type="text" class="form-control" id="gender">
                    </div>
                    <div class="mb-3 col-md-4">
                        <label class="form-label" for="emergency">Emergency
                            Contact</label>
                        <input type="text" class="form-control" id="emergency">
                    </div>
                    <div class="mb-3 col-md-4">
                        <label class="form-label" for="medical">Any relevant medical information</label>
                        <input type="text" class="form-control" id="medical">
                    </div>
                </div>
                <select class="booking-select mb-6" aria-label="Course selection">
                    <option selected>Membership Type</option>
                    <option value="1">Beginners Course</option>
                    <option value="2">Fast Track Course</option>
                </select>
                <select class="booking-select mb-6" aria-label="Number of places">
                    <option selected>Number of Places</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>

            </form>

        </div>

        <footer id="contact">
            <div class="row">
                <div class="col-md-4" id="copyright">
                    <p><a href="https://www.pixelio.co.uk" target="_blank" rel="noopener" aria-label="Visit our website (opens in a new tab)"><img src="assets/images/Pixelio-blue-logo.png" alt="Go to pixelio website" class="img-fluid" id="pix-logo"></a>&copy; 2026 Pixelio. All rights reserved.</p>
                </div>
                <div class="col-md-4" id="contact-info">
                <address>
                    <strong><i class="fa-solid fa-location-dot"></i> Winnington Park Bowmen</strong>
                    <br>
                    Moss Farm Leisure Complex,
                    <br>
                    Northwich, Cheshire, CW8 4BG
                </address>
                </div>
                <div class="col-md-4" id="socials">    
                    <a href="https://www.instagram.com" target="_blank" rel="noopener"
                        aria-label="Visit our Instagram page (opens in a new tab)"><i
                            class="fa-brands fa-instagram instagram-icon"></i></a>
                    <a href="https://www.facebook.com" target="_blank" rel="noopener"
                        aria-label="Visit our Facebook page (opens in a new tab)"><i
                            class="fa-brands fa-square-facebook facebook-icon"></i></a>
                    <a href="https://www.twitter.com" target="_blank" rel="noopener"
                        aria-label="Visit our Twitter feed (opens in a new tab)"><i
                            class="fa-brands fa-x-twitter twitter-icon"></i></a>
                </div>
            </div>
        </footer>

        <script src="app.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

        <!--Font Awesome-->
        <script src="https://kit.fontawesome.com/aa9af45995.js"
            crossorigin="anonymous"></script>
    </body>

</html>
